    <!-- ============================================================
         AUTO-ARCHIVE SCRIPT
         Reads every <article class="post-card"> from index.html,
         parses title / link / excerpt / date / read-time, then
         renders the grouped archive list. No backend required.
         To add a post: just add a new <article class="post-card">
         in index.html — the archive updates automatically.
    ============================================================ -->
    <script>
    (async function () {

        /* ── 1. Fetch and parse index.html ──────────────────────── */
        let doc;
        try {
            const res  = await fetch('index.html');
            const html = await res.text();
            const parser = new DOMParser();
            doc = parser.parseFromString(html, 'text/html');
        } catch (e) {
            document.getElementById('archive-root').innerHTML =
                '<p class="loading-msg">Could not load posts. Make sure archive.html is served from the same folder as index.html.</p>';
            return;
        }

        /* ── 2. Extract post data from each .post-card ───────────── */
        const cards = doc.querySelectorAll('article.post-card');
        const MONTHS = ['January','February','March','April','May','June',
                        'July','August','September','October','November','December'];

        const posts = [];
        cards.forEach(card => {
            const anchor  = card.querySelector('.post-card-title a');
            const excerpt = card.querySelector('.post-card-text');
            const meta    = card.querySelector('.post-meta');

            if (!anchor) return;

            const title   = anchor.textContent.trim();
            const href    = anchor.getAttribute('href');

            // Pull the date text from .post-meta (first text node after calendar icon)
            let dateStr = '', readTime = '';
            if (meta) {
                const metaText = meta.textContent.trim();
                // e.g. "November 28, 2025  8 min read"
                const dateMatch = metaText.match(/([A-Z][a-z]+ \d{1,2}, \d{4})/);
                const timeMatch = metaText.match(/(\d+ min read)/);
                if (dateMatch) dateStr  = dateMatch[1];
                if (timeMatch) readTime = timeMatch[1];
            }

            const dateObj = dateStr ? new Date(dateStr) : null;

            posts.push({ title, href, excerpt: excerpt ? excerpt.textContent.trim() : '', dateStr, dateObj, readTime });
        });

        // Sort newest first
        posts.sort((a, b) => (b.dateObj || 0) - (a.dateObj || 0));

        /* ── 3. Group by year → month ────────────────────────────── */
        const grouped = {};           // { year: { monthIndex: [post, …] } }
        const yearsSet = new Set();
        const monthsSet = new Set();

        posts.forEach(p => {
            const year  = p.dateObj ? p.dateObj.getFullYear() : 'Unknown';
            const month = p.dateObj ? p.dateObj.getMonth()    : -1;
            yearsSet.add(year);
            monthsSet.add(`${year}-${month}`);
            if (!grouped[year])        grouped[year]        = {};
            if (!grouped[year][month]) grouped[year][month] = [];
            grouped[year][month].push(p);
        });

        /* ── 4. Update statistics ────────────────────────────────── */
        document.getElementById('stat-total').textContent  = posts.length;
        document.getElementById('stat-years').textContent  = yearsSet.size;
        document.getElementById('stat-months').textContent = monthsSet.size;

        /* ── 5. Render HTML ──────────────────────────────────────── */
        function renderPosts(filter) {
            const root = document.getElementById('archive-root');
            const noResults = document.getElementById('no-results');
            let html = '';
            let visibleCount = 0;

            const years = Object.keys(grouped).sort((a, b) => b - a);
            years.forEach(year => {
                let yearHTML = '';
                const months = Object.keys(grouped[year]).sort((a, b) => b - a);
                months.forEach(month => {
                    let monthHTML = '';
                    grouped[year][month].forEach(p => {
                        if (filter && !p.title.toLowerCase().includes(filter) &&
                                      !p.excerpt.toLowerCase().includes(filter)) return;
                        visibleCount++;
                        monthHTML += `
                        <li class="post-item">
                            <div class="post-item-date">${p.dateStr || 'Date unknown'}</div>
                            <h4 class="post-item-title">
                                <a href="${p.href}">${p.title}</a>
                            </h4>
                            ${p.excerpt ? `<p class="post-item-excerpt">${p.excerpt}</p>` : ''}
                            <div class="post-item-meta">
                                ${p.readTime ? `<i class="far fa-clock"></i> ${p.readTime}` : ''}
                            </div>
                        </li>`;
                    });
                    if (monthHTML) {
                        yearHTML += `
                        <div class="month-section">
                            <h3 class="month-header">
                                <i class="far fa-calendar"></i> ${MONTHS[parseInt(month)] || 'Unknown'}
                            </h3>
                            <ul class="post-list">${monthHTML}</ul>
                        </div>`;
                    }
                });
                if (yearHTML) {
                    html += `
                    <div class="year-section">
                        <h2 class="year-header">${year}</h2>
                        ${yearHTML}
                    </div>`;
                }
            });

            root.innerHTML = html || '';
            noResults.style.display = visibleCount === 0 ? 'block' : 'none';
        }

        renderPosts('');

        /* ── 6. Live search ──────────────────────────────────────── */
        document.getElementById('search-input').addEventListener('input', function () {
            renderPosts(this.value.toLowerCase().trim());
        });

    })();
    </script>
